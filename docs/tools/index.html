<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求書 兼 領収書</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
          },
          colors: {
            beige: {
              DEFAULT: '#f3efe9', // テーブルヘッダーなどの薄いベージュ背景色
            }
          }
        }
      }
    }
  </script>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f3f4f6;
      /* プレビュー用の背景色 */
      -webkit-font-smoothing: antialiased;
    }

    .page-container {
      width: 210mm;
      height: 297mm;
      /* A4: 210mm × 297mm */
      margin: 2rem auto;
      background: white;
      padding: 10mm 15mm;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    @media print {

      html,
      body {
        width: 210mm;
        height: 297mm;
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        background-color: white;
      }

      .page-container {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 10mm 15mm;
        box-shadow: none;
        page-break-after: avoid;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      input {
        border: none !important;
        outline: none !important;
        background: transparent !important;
      }

      .bg-beige {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
  <script defer>
    // save on input to local storage
    document.addEventListener('input', function (event) {
      localStorage.setItem(event.target.name, event.target.value);
    });

    // load from local storage
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('input').forEach(input => {
        if (localStorage.getItem(input.name)) {
          input.value = localStorage.getItem(input.name);
        }
      });
    });
  </script>
</head>

<body class="font-serif text-[#333]">

  <div class="page-container relative">

    <div class="flex justify-end items-end">
      <div class="text-[13px] mb-3 flex items-center gap-2">
        <span class="text-gray-600 tracking-widest whitespace-nowrap">請求書番号</span>
        <span class="text-gray-300">|</span>
        <input name="invoice_number" type="text" class="text-right tracking-widest w-28" value="" placeholder="0001">
      </div>
    </div>
    <!-- ヘッダーエリア -->
    <div class="relative mb-16">
      <h1 class="text-2xl tracking-[0.3em] text-center font-medium pt-8">請求書 兼 領収書</h1>

      <!-- 右上：請求書番号・ロゴ -->
      <div class="absolute top-0 right-0 flex flex-col items-end">
        <img src="logo.png" width="108" height="108" alt="MUSUBI">
      </div>
    </div>

    <!-- 宛名・日付エリア -->
    <div class="flex justify-between items-end mb-10">
      <div class="w-[55%]">
        <div class="border-b border-gray-400 pb-1 mb-6 flex justify-between items-end">
          <span class="text-2xl tracking-widest pl-4">
            <input name="customer_name" type="text" class="w-full" value="" placeholder="お名前">
          </span>
          <span class="text-xl mr-8">様</span>
        </div>
        <div class="text-[13px] leading-loose tracking-wide text-gray-800">
          この度は、ご利用いただきありがとうございました。<br>
          下記の通りご請求申し上げます。
        </div>
      </div>

      <div class="w-[38%] pb-4">
        <table class="w-full text-[13px]">
          <tbody>
            <tr class="border-b border-gray-200">
              <td class="py-2 text-gray-600 w-24 tracking-widest">請求日</td>
              <td class="py-2 text-center text-gray-300 w-4">|</td>
              <td class="py-2 text-right tracking-widest">
                <input name="invoice_date" type="text" class="w-full text-right" value="" placeholder="yyyy年 mm月 dd日">
              </td>
            </tr>
            <tr class="border-b border-gray-200">
              <td class="py-2 text-gray-600 tracking-widest">お支払い期限</td>
              <td class="py-2 text-center text-gray-300">|</td>
              <td class="py-2 text-right tracking-widest">
                <input name="payment_due_date" type="text" class="w-full text-right" value=""
                  placeholder="yyyy年 mm月 dd日">
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>


    <div class="flex justify-start mb-4">
      <div class="w-[60%]">
        <div class="font-bold flex flex-row items-baseline justify-between py-2.5 px-4 border-b border-gray-400">
          <span class="font-medium tracking-widest whitespace-nowrap mr-4">ご請求金額</span>
          <div class="flex flex-row items-center gap-1 whitespace-nowrap">
            <input name="total_with_tax" type="text"
              class="tracking-wider text-3xl font-bold text-right bg-transparent px-2 w-45 h-10 leading-none" value=""
              placeholder="¥3,300" style="min-width: 90px; max-width: 240px;" />
            <span class="text-xs text-gray-700 ml-1">(税込)</span>
          </div>
        </div>
        <div class="text-sm flex gap-6">
          <span class="text-gray-700 tracking-widest">但し</span>
          <span class="font-medium tracking-wider">
            <input name="subject" type="text" class="w-full" value="ペットシッター料金として">
          </span>
        </div>
        <div class="text-sm text-gray-700 tracking-widest">上記正に領収いたしました。</div>

      </div>
    </div>

    <!-- 明細テーブル -->
    <table class="w-full text-sm mb-6">
      <thead>
        <tr class="bg-beige">
          <th class="py-2 text-center font-normal text-gray-700 w-[20%] tracking-widest">日付</th>
          <th class="py-2 text-center font-normal text-gray-700 w-[55%] tracking-widest">内容</th>
          <th class="py-2 text-center font-normal text-gray-700 w-[25%] tracking-widest">金額</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_1" type="text" class="w-full text-center" value="" placeholder="4月15日">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_1" type="text" class="w-full" value="" placeholder="シッティング料">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_1" type="text" class="w-full text-right" value="" placeholder="¥1,500">
          </td>
        </tr>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_2" type="text" class="w-full text-center" value="">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_2" type="text" class="w-full" value="">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_2" type="text" class="w-full text-right" value="">
          </td>
        </tr>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_3" type="text" class="w-full text-center" value="">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_3" type="text" class="w-full" value="">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_3" type="text" class="w-full text-right" value="">
          </td>
        </tr>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_4" type="text" class="w-full text-center" value="">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_4" type="text" class="w-full" value="">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_4" type="text" class="w-full text-right" value="">
          </td>
        </tr>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_5" type="text" class="w-full text-center" value="">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_5" type="text" class="w-full" value="">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_5" type="text" class="w-full text-right" value="">
          </td>
        </tr>
        <tr class="border-b border-gray-200">
          <td class="py-2.5 text-center tracking-widest">
            <input name="date_6" type="text" class="w-full text-center" value="">
          </td>
          <td class="py-2.5 px-8 tracking-wide">
            <input name="content_6" type="text" class="w-full" value="">
          </td>
          <td class="py-2.5 text-right px-8 tracking-wider">
            <input name="amount_6" type="text" class="w-full text-right" value="">
          </td>
        </tr>
      </tbody>
    </table>

    <!-- 金額集計エリア -->
    <div class="flex justify-end mb-16">
      <div class="w-[42%]">
        <div class="flex justify-between border-b border-gray-300 py-1.5 px-4 bg-beige text-sm">
          <span class="text-gray-700 tracking-widest w-40">小計</span>
          <span class="tracking-wider w-full"><input name="subtotal" type="text"
              class="w-full text-right bg-transparent" value="" placeholder="¥3,000"></span>
        </div>
        <div class="flex justify-between border-b border-gray-300 py-1.5 px-4 bg-beige text-sm">
          <span class="text-gray-700 tracking-widest w-40">税 (10%)</span>
          <span class="tracking-wider w-full"><input name="tax" type="text" class="w-full text-right bg-transparent"
              value="" placeholder="¥300"></span>
        </div>
        <div class="font-bold flex justify-between py-2.5 px-4 border-b border-gray-400">
          <span class="tracking-widest w-40">合計</span>
          <span class="text-lg tracking-wider w-full"><input name="total" type="text"
              class="w-full text-right bg-transparent" value="" placeholder="¥3,300"></span>
        </div>
      </div>
    </div>

    <!-- フッター（振込先・発行元） -->
    <div class="flex mt-1">

      <!-- 振込先情報 -->
      <div class="flex-1 pr-6 flex flex-col justify-between">
        <div class="text-[13px] text-gray-800 tracking-wide">
          <div class="flex mb-2">
            <span class="w-20 text-gray-700">振込先：</span>
            <span class="font-medium text-black"><input name="bank_name" type="text" class="w-full bg-transparent"
                value=""></span>
          </div>
          <div class="flex mb-1.5">
            <span class="w-20 text-gray-700">口座種：</span>
            <span><input name="account_type" type="text" class="w-full bg-transparent" value=""></span>
          </div>
          <div class="flex mb-1.5">
            <span class="w-20 text-gray-700">口座番号：</span>
            <span><input name="account_number" type="text" class="w-full bg-transparent" value=""></span>
          </div>
          <div class="flex mb-1.5">
            <span class="w-20 text-gray-700">口座名義：</span>
            <span><input name="account_holder" type="text" class="w-full bg-transparent" value=""></span>
          </div>
        </div>
        <div class="border-t border-gray-300 pt-1 mt-1 text-[11px] text-gray-600 tracking-wider">
          恐れ入りますが、振込手数料はご負担ください。
        </div>
      </div>

      <!-- 縦の区切り線 -->
      <div class="w-px bg-gray-300 mx-6"></div>

      <!-- 発行元情報 -->
      <div class="flex-1 pl-4">
        <div class="text-lg font-medium border-b border-gray-300 pb-2 mb-4 tracking-widest">
          結
        </div>
        <div class="space-y-3 text-[12px] text-gray-700 tracking-wide font-sans">
          <div class="flex items-center">
            <!-- TEL Icon -->
            <svg class="w-3.5 h-3.5 mr-3 text-black" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor">
              <path
                d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
            </svg>
            <input name="tel" type="text" class="w-full bg-transparent" value="TEL : 070-1890-4727">
          </div>
          <div class="flex items-center">
            <!-- Mail Icon -->
            <svg class="w-3.5 h-3.5 mr-3 text-black" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor">
              <path
                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
            <input name="email" type="text" class="w-full bg-transparent" value="musubi.petsitter@gmail.com">
          </div>
          <div class="flex items-center">
            <!-- Pin Icon -->
            <svg class="w-3.5 h-3.5 mr-3 text-black" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor">
              <path
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
            <input name="address" type="text" class="w-full bg-transparent font-serif" value="島根県出雲市上塩冶町 2623-1-1104">
          </div>
        </div>
      </div>

    </div>

  </div>

</body>

</html>
